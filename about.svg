<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="aboutGlow1" cx="10%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aboutGlow2" cx="95%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aboutStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.45"/>
    </linearGradient>
    <clipPath id="aboutRounded">
      <rect x="0" y="0" width="1200" height="220" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#aboutRounded)">
    <rect width="1200" height="220" fill="#0b0b12"/>
    <rect width="1200" height="220" fill="url(#aboutGlow1)"/>
    <rect width="1200" height="220" fill="url(#aboutGlow2)"/>
    <rect x="1.5" y="1.5" width="1197" height="217" rx="23" fill="none" stroke="url(#aboutStroke)" stroke-width="1.5"/>

    <!-- prompt chip -->
    <rect x="48" y="40" width="150" height="34" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="64" y="62" font-family="'JetBrains Mono','Courier New',monospace" font-size="14" fill="#22d3ee">$ cat about.txt</text>

    <!-- body copy -->
    <text font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#e2e8f0">
      <tspan x="48" y="140">More about me at</tspan>
      <tspan x="48" y="172" font-family="'JetBrains Mono','Courier New',monospace" fill="#22d3ee">naidrer.mjlteam.de</tspan>
    </text>

    <!-- side accent dot column -->
    <g fill="#7c3aed" fill-opacity="0.6">
      <circle cx="1140" cy="60" r="3"/>
      <circle cx="1140" cy="80" r="3"/>
      <circle cx="1140" cy="100" r="3"/>
    </g>
  </g>
</svg>
