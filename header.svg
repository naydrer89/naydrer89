<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlow1" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="90%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow3" cx="55%" cy="100%" r="45%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6f7fb"/>
      <stop offset="60%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="rounded">
      <rect x="0" y="0" width="1200" height="280" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="280" fill="#0b0b12"/>
    <rect width="1200" height="280" fill="url(#bgGlow1)"/>
    <rect width="1200" height="280" fill="url(#bgGlow2)"/>
    <rect width="1200" height="280" fill="url(#bgGlow3)"/>

    <!-- faint grid texture -->
    <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
      <line x1="0" y1="70" x2="1200" y2="70"/>
      <line x1="0" y1="140" x2="1200" y2="140"/>
      <line x1="0" y1="210" x2="1200" y2="210"/>
    </g>

    <!-- glass panel border -->
    <rect x="1.5" y="1.5" width="1197" height="277" rx="23" fill="none" stroke="url(#panelStroke)" stroke-width="1.5"/>

    <!-- floating orbit rings, decorative -->
    <circle cx="1060" cy="70" r="80" fill="none" stroke="#22d3ee" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="1060" cy="70" r="115" fill="none" stroke="#7c3aed" stroke-opacity="0.1" stroke-width="1"/>
    <circle cx="1060" cy="70" r="4" fill="#22d3ee"/>

    <!-- eyebrow -->
    <text x="72" y="88" font-family="'JetBrains Mono','Courier New',monospace" font-size="14" fill="#22d3ee" letter-spacing="2">developer profile</text>

    <!-- name -->
    <text x="70" y="150" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="700" fill="url(#nameGrad)">Naidrer</text>

    <!-- tagline -->
    <text x="72" y="188" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#c7d2e0" fill-opacity="0.85">Building and shipping in public — Flask, automation, AI-assisted engineering.</text>

    <!-- tag chips -->
    <g font-family="'JetBrains Mono','Courier New',monospace" font-size="13" fill="#e6f7fb">
      <rect x="72" y="212" width="90" height="30" rx="15" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed" stroke-opacity="0.5"/>
      <text x="93" y="231">Flask</text>

      <rect x="172" y="212" width="118" height="30" rx="15" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="192" y="231">Automation</text>

      <rect x="300" y="212" width="86" height="30" rx="15" fill="#f472b6" fill-opacity="0.15" stroke="#f472b6" stroke-opacity="0.5"/>
      <text x="321" y="231">AI Agents</text>
    </g>
  </g>
</svg>
