<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="skillGlow1" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skillGlow2" cx="0%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skillStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.4"/>
    </linearGradient>
    <clipPath id="skillRounded">
      <rect x="0" y="0" width="1200" height="260" rx="24"/>
    </clipPath>

    <!-- reusable chip styles per category -->
    <linearGradient id="chipLang" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="chipTool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="chipInfra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#skillRounded)">
    <rect width="1200" height="260" fill="#0b0b12"/>
    <rect width="1200" height="260" fill="url(#skillGlow1)"/>
    <rect width="1200" height="260" fill="url(#skillGlow2)"/>
    <rect x="1.5" y="1.5" width="1197" height="257" rx="23" fill="none" stroke="url(#skillStroke)" stroke-width="1.5"/>

    <rect x="48" y="34" width="130" height="34" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#f472b6" stroke-opacity="0.4"/>
    <text x="64" y="56" font-family="'JetBrains Mono','Courier New',monospace" font-size="14" fill="#f472b6">~/ stack</text>

    <!-- category label -->
    <text x="48" y="100" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#8b93a7" letter-spacing="1.5">LANGUAGES</text>
    <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e2e8f0">
      <rect x="48" y="112" width="88" height="32" rx="16" fill="url(#chipLang)" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="70" y="133">Python</text>

      <rect x="146" y="112" width="112" height="32" rx="16" fill="url(#chipLang)" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="168" y="133">JavaScript</text>

      <rect x="268" y="112" width="112" height="32" rx="16" fill="url(#chipLang)" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="290" y="133">TypeScript</text>
    </g>

    <text x="48" y="172" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#8b93a7" letter-spacing="1.5">FRAMEWORKS &amp; TOOLS</text>
    <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e2e8f0">
      <rect x="48" y="184" width="80" height="32" rx="16" fill="url(#chipTool)" stroke="#7c3aed" stroke-opacity="0.45"/>
      <text x="68" y="205">Flask</text>

      <rect x="138" y="184" width="118" height="32" rx="16" fill="url(#chipTool)" stroke="#7c3aed" stroke-opacity="0.45"/>
      <text x="158" y="205">SQLAlchemy</text>

      <rect x="266" y="184" width="98" height="32" rx="16" fill="url(#chipTool)" stroke="#7c3aed" stroke-opacity="0.45"/>
      <text x="286" y="205">FastAPI</text>

      <rect x="374" y="184" width="90" height="32" rx="16" fill="url(#chipTool)" stroke="#7c3aed" stroke-opacity="0.45"/>
      <text x="394" y="205">Tailwind</text>

      <rect x="474" y="184" width="66" height="32" rx="16" fill="url(#chipTool)" stroke="#7c3aed" stroke-opacity="0.45"/>
      <text x="494" y="205">htmx</text>
    </g>

    <!-- right column: infra -->
    <text x="700" y="100" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#8b93a7" letter-spacing="1.5">SYSTEMS</text>
    <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e2e8f0">
      <rect x="700" y="112" width="98" height="32" rx="16" fill="url(#chipInfra)" stroke="#f472b6" stroke-opacity="0.4"/>
      <text x="720" y="133">CachyOS</text>

      <rect x="806" y="112" width="66" height="32" rx="16" fill="url(#chipInfra)" stroke="#f472b6" stroke-opacity="0.4"/>
      <text x="826" y="133">Linux</text>

      <rect x="880" y="112" width="66" height="32" rx="16" fill="url(#chipInfra)" stroke="#f472b6" stroke-opacity="0.4"/>
      <text x="900" y="133">Git</text>
    </g>

    <text x="700" y="172" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#8b93a7" letter-spacing="1.5">AI &amp; AGENTS</text>
    <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e2e8f0">
      <rect x="700" y="184" width="126" height="32" rx="16" fill="url(#chipInfra)" stroke="#f472b6" stroke-opacity="0.4"/>
      <text x="720" y="205">Claude Code</text>

      <rect x="834" y="184" width="106" height="32" rx="16" fill="url(#chipInfra)" stroke="#f472b6" stroke-opacity="0.4"/>
      <text x="854" y="205">Codex CLI</text>

      <rect x="948" y="184" width="112" height="32" rx="16" fill="url(#chipInfra)" stroke="#f472b6" stroke-opacity="0.4"/>
      <text x="968" y="205">OpenCode</text>
    </g>
  </g>
</svg>
